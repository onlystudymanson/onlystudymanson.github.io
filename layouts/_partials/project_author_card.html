<section aria-label="About the author" class="not-prose mt-12 text-left">
  <h2 class="text-xl font-bold text-neutral-800 dark:text-neutral-200">
    {{ .title }}
  </h2>
  <p class="mt-1 text-sm text-neutral-700 dark:text-neutral-300">
    Ph.D. candidate in Mechanical Engineering, Yonsei University
  </p>
  <div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-3 text-sm">
    <div class="text-xl">
      {{ partial "social_links" (dict "Params" (dict "profiles" .links)) }}
    </div>
    <a href="{{ site.Home.RelPermalink }}" class="text-neutral-700 underline underline-offset-4 hover:text-primary-700 dark:text-neutral-300 dark:hover:text-primary-400">More about me →</a>
  </div>
</section>
