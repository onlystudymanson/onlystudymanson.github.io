{{ $content := .wcBlock.content }}

<div class="container mx-auto max-w-5xl px-6">
  <h2 class="mb-10 text-center text-3xl font-bold">{{ $content.title }}</h2>
  <div class="space-y-8">
    {{ range $content.items }}
      <article>
        <div class="flex flex-col gap-2 sm:flex-row sm:items-baseline sm:justify-between sm:gap-6">
          <h3 class="text-xl font-semibold text-neutral-900 dark:text-neutral-100">{{ .title }}</h3>
          <p class="text-sm text-neutral-600 dark:text-neutral-300 sm:shrink-0">{{ .dates }}</p>
        </div>
        <p class="mt-2 text-base text-neutral-700 dark:text-neutral-300">
          {{ with .role }}{{ . }} · {{ end }}{{ .organization }}
        </p>
        {{ with .description }}
          <p class="mt-2 text-base leading-relaxed text-neutral-600 dark:text-neutral-300">{{ . }}</p>
        {{ end }}
      </article>
    {{ end }}
  </div>
</div>
